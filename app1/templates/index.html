{% extends 'base.html' %}
{% load static %}
{% block title %} Главная страница {% endblock %}
{% block body %}
<div class="center">
    <h1 class="text-center h1">Добро пожаловать на главную страницу сервиса техподдержки HelpDesk</h1>
    <p class="text-center display-5">На данном ресурсе вы можете составить заявку на помощь</p>
    <div id="carouselExampleSlidesOnly" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="{% static 'media/img/1.jpg' %}" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img src="{% static 'media/img/3.jpg' %}" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img src="{% static 'media/img/4.png' %}" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img src="{% static 'media/img/7.png' %}" class="d-block w-100" alt="...">
            </div>
        </div>
    </div>
</div>
{% endblock %}
